<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>配置</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <style>
    :root {
      --bg-primary: #21212a;
      --bg-secondary: #1a1a24;
      --text-primary: #f5f5f7;
      --text-muted: #98989c;
      --accent-primary: #5582dc;
      --accent-secondary: #3e3e48;
      --border-color: rgba(255, 255, 255, 0.06);
      --border-active: rgba(255, 255, 255, 0.2);
      --sidebar-bg: #1a1a24;
      --code-bg: #2d2d3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--accent-primary);
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100vh;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .sidebar-menu {
      padding: 0.75rem 0;
    }

    .menu-section {
      margin-bottom: 0.25rem;
    }

    .menu-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.15s ease;
    }

    .menu-section-header:hover {
      color: var(--text-primary);
    }

    .menu-section-header svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
    }

    .menu-section.collapsed .menu-section-header svg {
      transform: rotate(-90deg);
    }

    .menu-section-items {
      overflow: hidden;
      transition: max-height 0.2s ease;
    }

    .menu-section.collapsed .menu-section-items {
      max-height: 0;
    }

    .menu-item {
      display: block;
      padding: 0.4rem 1.5rem 0.4rem 2rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      transition: color 0.15s ease;
    }

    .menu-item:hover {
      color: var(--text-primary);
    }

    .menu-item.active {
      color: var(--accent-primary);
      font-weight: 500;
    }

    /* Main content */
    .main-content {
      margin-left: 280px;
      padding: 2rem 3rem;
      min-height: 100vh;
      max-width: 900px;
    }

    .content-wrapper {
      max-width: 720px;
    }

    /* Mobile hamburger */
    .hamburger {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 200;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      padding: 0.5rem;
      cursor: pointer;
      border-radius: 0.375rem;
    }

    .hamburger svg {
      width: 20px;
      height: 20px;
      color: var(--text-primary);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 50;
    }

    /* Code blocks */
    pre {
      background-color: var(--code-bg) !important;
      border-radius: 0.5rem;
      padding: 1rem 1.25rem !important;
      overflow-x: auto;
      margin: 1.25rem 0;
      border: 1px solid var(--border-color);
    }

    code {
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 0.875rem;
      font-feature-settings: "liga" 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .main-content {
        margin-left: 0;
        padding: 4rem 1.5rem 2rem;
      }
    }

    /* Markdown content styles */
    .content-wrapper h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin: 2rem 0 1rem;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .content-wrapper h2 {
      font-size: 0.9375rem;
      font-weight: 600;
      margin: 1.75rem 0 0.75rem;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .content-wrapper h3 {
      font-size: 1rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
      color: var(--text-primary);
    }

    .content-wrapper p {
      margin: 0.875rem 0;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .content-wrapper ul, .content-wrapper ol {
      margin: 0.875rem 0;
      padding-left: 1.5rem;
    }

    .content-wrapper li {
      margin: 0.375rem 0;
      line-height: 1.6;
    }

    .content-wrapper blockquote {
      border-left: 3px solid var(--accent-primary);
      padding-left: 1rem;
      margin: 1rem 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .content-wrapper hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 2rem 0;
    }

    .content-wrapper img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      margin: 1rem 0;
      border: 1px solid var(--border-color);
    }

    .content-wrapper table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.875rem;
    }

    .content-wrapper th, .content-wrapper td {
      border: 1px solid var(--border-color);
      padding: 0.625rem 0.875rem;
      text-align: left;
    }

    .content-wrapper th {
      background-color: var(--bg-secondary);
      font-weight: 600;
      color: var(--text-primary);
    }

    .content-wrapper td {
      color: var(--text-primary);
    }

    .content-wrapper tr:nth-child(even) td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Header anchor links */
    .content-wrapper .header-anchor {
      opacity: 0;
      margin-left: 0.5rem;
      color: var(--text-muted);
      transition: opacity 0.15s ease;
    }

    .content-wrapper h1:hover .header-anchor,
    .content-wrapper h2:hover .header-anchor,
    .content-wrapper h3:hover .header-anchor {
      opacity: 1;
    }

    /* Inline code */
    :not(pre) > code {
      background-color: var(--bg-secondary);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="sidebar-title">Docs</h1>
    </div>
    <nav class="sidebar-menu" id="sidebarMenu">
      <script>
        (function() {
          var menuContainer = document.getElementById('sidebarMenu');
          var menuData = window.MENU_DATA || { items: [] };

          function renderMenu(items, container) {
            items.forEach(function(item) {
              if (item.children && item.children.length > 0) {
                var section = document.createElement('div');
                section.className = 'menu-section';

                var header = document.createElement('div');
                header.className = 'menu-section-header';
                header.innerHTML = '<span>' + item.title + '</span>';
                header.innerHTML += '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>';

                var sectionItems = document.createElement('div');
                sectionItems.className = 'menu-section-items';

                header.addEventListener('click', function() {
                  section.classList.toggle('collapsed');
                });

                renderMenu(item.children, sectionItems);
                section.appendChild(header);
                section.appendChild(sectionItems);
                container.appendChild(section);
              } else {
                var link = document.createElement('a');
                link.href = item.path || '#';
                link.className = 'menu-item' + (item.active ? ' active' : '');
                link.textContent = item.title;
                if (item.target) link.target = item.target;
                container.appendChild(link);
              }
            });
          }

          renderMenu(menuData.items || [], menuContainer);
        })();
      </script>
    </nav>
  </aside>

  <main class="main-content">
    <div class="content-wrapper">
      <h1 id="-" tabindex="-1"><a class="header-anchor" href="#-">配置</a></h1>
<p>了解如何配置你的文档站点。</p>
<h2 id="--1" tabindex="-1"><a class="header-anchor" href="#--1">基本配置</a></h2>
<p>在 <code>package.json</code> 中可以修改项目名称和版本。</p>
<h2 id="--2" tabindex="-1"><a class="header-anchor" href="#--2">目录结构</a></h2>
<pre class="language-text"><code class="language-text">src/           # Markdown 源文件
template/      # HTML 模板
scripts/       # 构建脚本
docs/          # 编译输出
</code></pre>
<h2 id="--3" tabindex="-1"><a class="header-anchor" href="#--3">部署</a></h2>
<p>push 到 GitHub 后，GitHub Actions 会自动编译并部署到 GitHub Pages。</p>

    </div>
  </main>

  <script>
    (function() {
      var hamburger = document.getElementById('hamburgerBtn');
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('sidebarOverlay');

      function toggleMenu() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      }

      hamburger.addEventListener('click', toggleMenu);
      overlay.addEventListener('click', toggleMenu);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          sidebar.classList.remove('open');
          overlay.classList.remove('open');
        }
      });
    })();
  </script>
</body>
</html>
