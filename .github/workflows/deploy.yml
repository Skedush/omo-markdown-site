name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          cd /tmp
          git clone --branch gh-pages --depth 1 https://github.com/${{ github.repository }}.git gh-pages-deploy 2>/dev/null || git clone --depth 1 https://github.com/${{ github.repository }}.git gh-pages-deploy
          cd gh-pages-deploy
          rm -rf .
          cp -r "${{ github.workspace }}/docs"/* .
          git add -A
          git commit -m "docs: auto-build from ${{ github.sha }}"
          git push -f origin gh-pages
