name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: /omo-markdown-site
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          rm -rf /tmp/gh-pages-deploy
          git clone --branch gh-pages --depth 1 https://github.com/${{ github.repository }}.git /tmp/gh-pages-deploy 2>/dev/null || git clone --depth 1 https://github.com/${{ github.repository }}.git /tmp/gh-pages-deploy
          cd /tmp/gh-pages-deploy
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rm -rf . --quiet 2>/dev/null || true
          cp -r "${{ github.workspace }}/public/"* .
          git add -A
          git commit -m "docs: auto-build from ${{ github.sha }}" --allow-empty
          git push -f origin gh-pages
